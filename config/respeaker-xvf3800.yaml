# reSpeaker XVF3800 + XIAO ESP32S3 voice satellite for Clap.
#
# Built on formatBCE's integration (the one Seeed's Home Assistant guide uses):
#   https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
# Changes from its example config:
#   - "hey_klap" wake word (from this repo), added to the stock models
#   - the wake sound is the stock beep + "Yes?" in the ElevenLabs ogre_man voice
#     (sounds/wake_yes.flac). Turn it off with the device's "Wake sound" switch.
# Replies play on the board's own output (3.5mm jack / speaker connector).
#
# Needs ESPHome 2026.9.0 or newer (the package's min_version).
#
# Setting it up in the ESPHome Device Builder add-on:
#   1. New device -> name it -> ESP32-S3. The wizard writes api: (encryption key),
#      ota: and wifi: blocks for you - keep those three.
#   2. Delete the wizard's esphome:, esp32: and logger: blocks (the package sets
#      them), then paste substitutions:, packages: and micro_wake_word: from here.
#   3. Set name: below to the name you gave the device in the wizard.

substitutions:
  name: respeakeresp
  friendly_name: respeakeresp

  # Pinned so a change upstream can't break the next build. To update, set a newer
  # commit or tag from the repo above.
  respeaker_ref: 542a05d44b6eb2c646a6ba0acd3e0cf2e6edcfab
  # DEBUG shows wake word detections (with confidence) and the ones the VAD blocked.
  # Back to INFO for quieter logs.
  log_level: DEBUG
  # Give up listening if no speech starts within this long (includes the wake sound).
  no_speech_timeout: 5s

  # Beep, then "Yes?" (played by the package's wake-sound logic).
  wake_word_triggered_sound_file: https://raw.githubusercontent.com/scottbonline/mww/main/sounds/wake_yes.flac

packages:
  respeaker:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

# Appended to the package's models (ESPHome joins the two lists). Pick "hey_klap"
# as the wake word on the device's page in Home Assistant.
micro_wake_word:
  models:
    - model: https://raw.githubusercontent.com/scottbonline/mww/refs/heads/main/data/hey_klap.json
      id: hey_klap
    - model: alexa
      id: alexa

# Needs log_level: DEBUG above (the package sets micro_wake_word to INFO).
logger:
  logs:
    micro_wake_word: DEBUG

# Stop listening if no speech starts within ${no_speech_timeout} of listening (HA alone
# waits ~15s). The package's own voice_assistant/script lists are kept: ESPHome
# appends these to them.
voice_assistant:
  on_listening:
    - script.execute: no_speech_timeout
  on_stt_vad_start:
    - script.stop: no_speech_timeout
  on_end:
    - script.stop: no_speech_timeout

script:
  - id: no_speech_timeout
    mode: restart
    then:
      - delay: ${no_speech_timeout}
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id};
          then:
            - logger.log:
                level: INFO
                format: "No speech within ${no_speech_timeout} - stopping"
            - voice_assistant.stop:


# --- From the Device Builder wizard (keep yours) ---
# api:
#   encryption:
#     key: "..."
# ota:
#   - platform: esphome
#     password: "..."
# wifi:
